<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local SEO Lead Scraper</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3d;
    --accent: #00ff88;
    --accent2: #7c3aed;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --danger: #ff4455;
    --warning: #ffaa00;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .grid-bg {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .glow {
    position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
    width: 600px; height: 400px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(124,58,237,0.15) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  .container {
    max-width: 820px; margin: 0 auto; padding: 40px 24px;
    position: relative; z-index: 1;
  }

  header { text-align: center; margin-bottom: 48px; }

  .badge {
    display: inline-block;
    background: rgba(0,255,136,0.1);
    border: 1px solid rgba(0,255,136,0.3);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 2px;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(24px, 4vw, 38px);
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 12px;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    color: var(--muted);
    font-size: 15px;
    font-weight: 300;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 20px;
  }

  .card-title {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  input, select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,255,136,0.1);
  }

  input::placeholder { color: var(--muted); }

  select option { background: var(--surface2); }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }

  .field { margin-bottom: 16px; }

  .api-field {
    position: relative;
  }

  .api-field input {
    padding-right: 90px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
  }

  .toggle-eye {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 12px; font-family: 'Space Mono', monospace;
    padding: 4px 8px;
    transition: color 0.2s;
  }
  .toggle-eye:hover { color: var(--accent); }

  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: var(--accent);
    color: #0a0a0f;
  }

  .btn-primary:hover:not(:disabled) {
    background: #00e07a;
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(0,255,136,0.3);
  }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .btn-download {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    margin-top: 12px;
  }

  .btn-download:hover {
    background: rgba(0,255,136,0.1);
    transform: translateY(-1px);
  }

  .status-bar {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    display: none;
    align-items: center;
    gap: 10px;
  }

  .status-bar.show { display: flex; }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }

  .dot.running { background: var(--warning); animation: pulse 1s infinite; }
  .dot.done { background: var(--accent); }
  .dot.error { background: var(--danger); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .progress-wrap {
    background: var(--surface2);
    border-radius: 4px;
    height: 4px;
    margin-top: 12px;
    overflow: hidden;
    display: none;
  }

  .progress-wrap.show { display: block; }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 4px;
    width: 0%;
    transition: width 0.5s ease;
  }

  .results-card {
    display: none;
    animation: fadeUp 0.4s ease;
  }

  .results-card.show { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  @media (max-width: 560px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }

  .stat-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }

  .stat-num {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  .table-wrap {
    overflow-x: auto;
    border-radius: 10px;
    border: 1px solid var(--border);
    max-height: 360px;
    overflow-y: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead { position: sticky; top: 0; z-index: 2; }

  th {
    background: var(--surface2);
    padding: 10px 14px;
    text-align: left;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 10px 14px;
    border-bottom: 1px solid rgba(42,42,61,0.5);
    vertical-align: top;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
  }

  .tag-green { background: rgba(0,255,136,0.1); color: var(--accent); }
  .tag-red { background: rgba(255,68,85,0.1); color: var(--danger); }
  .tag-yellow { background: rgba(255,170,0,0.1); color: var(--warning); }

  .stars { color: var(--warning); font-size: 12px; }

  .help-text {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .help-text a { color: var(--accent); text-decoration: none; }
  .help-text a:hover { text-decoration: underline; }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 24px 0;
  }

  .log-box {
    background: var(--surface2);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    max-height: 100px;
    overflow-y: auto;
    margin-top: 12px;
    display: none;
  }

  .log-box.show { display: block; }
  .log-line { margin-bottom: 4px; }
  .log-line.ok { color: var(--accent); }
  .log-line.err { color: var(--danger); }
  .log-line.info { color: var(--warning); }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow"></div>

<div class="container">
  <header>
    <div class="badge">LOCAL SEO TOOL</div>
    <h1>Lead <span>Scraper</span></h1>
    <p class="subtitle">Google Maps থেকে business data সংগ্রহ করো → Excel export করো</p>
  </header>

  <!-- API Key Card -->
  <div class="card">
    <div class="card-title">Apify API Key</div>
    <div class="field">
      <label>তোমার Apify API Token</label>
      <div class="api-field">
        <input type="password" id="apiKey" placeholder="apify_api_xxxxxxxxxxxxxxxx" autocomplete="off">
        <button class="toggle-eye" onclick="toggleKey()">SHOW</button>
      </div>
      <p class="help-text">
        Key পাবে: <a href="https://console.apify.com/account/integrations" target="_blank">console.apify.com → Settings → Integrations</a>
      </p>
    </div>
  </div>

  <!-- Search Card -->
  <div class="card">
    <div class="card-title">Search Settings</div>
    <div class="grid-2">
      <div class="field">
        <label>Business Type (Niche)</label>
        <input type="text" id="niche" placeholder="mobile phone repair shop" value="mobile phone repair shop">
      </div>
      <div class="field">
        <label>City / Location</label>
        <input type="text" id="city" placeholder="Houston, Texas" value="Houston, Texas">
      </div>
    </div>
    <div class="grid-2">
      <div class="field">
        <label>কতটা Result চাও</label>
        <select id="maxResults">
          <option value="20">20 businesses</option>
          <option value="50" selected>50 businesses</option>
          <option value="100">100 businesses</option>
          <option value="200">200 businesses</option>
        </select>
      </div>
      <div class="field">
        <label>Minimum Rating</label>
        <select id="minRating">
          <option value="0">যেকোনো rating</option>
          <option value="3">3+ stars</option>
          <option value="4" selected>4+ stars</option>
          <option value="4.5">4.5+ stars</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary" id="startBtn" onclick="startScraping()">
      START SCRAPING
    </button>

    <div class="status-bar" id="statusBar">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">শুরু হচ্ছে...</span>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="log-box" id="logBox"></div>
  </div>

  <!-- Results Card -->
  <div class="card results-card" id="resultsCard">
    <div class="card-title">Results</div>

    <div class="stats-row" id="statsRow"></div>

    <div class="table-wrap">
      <table id="resultsTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Business Name</th>
            <th>Phone</th>
            <th>Website</th>
            <th>Rating</th>
            <th>Reviews</th>
            <th>Address</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <button class="btn btn-download" onclick="downloadExcel()">
      EXCEL DOWNLOAD করো
    </button>
  </div>
</div>

<script>
let scrapedData = [];
let keyVisible = false;

function toggleKey() {
  const inp = document.getElementById('apiKey');
  const btn = document.querySelector('.toggle-eye');
  keyVisible = !keyVisible;
  inp.type = keyVisible ? 'text' : 'password';
  btn.textContent = keyVisible ? 'HIDE' : 'SHOW';
}

function log(msg, type='') {
  const box = document.getElementById('logBox');
  box.classList.add('show');
  const line = document.createElement('div');
  line.className = 'log-line ' + type;
  line.textContent = '> ' + msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function setStatus(text, state) {
  const bar = document.getElementById('statusBar');
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  bar.classList.add('show');
  dot.className = 'dot ' + state;
  txt.textContent = text;
}

function setProgress(pct) {
  document.getElementById('progressWrap').classList.add('show');
  document.getElementById('progressBar').style.width = pct + '%';
}

async function startScraping() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const niche = document.getElementById('niche').value.trim();
  const city = document.getElementById('city').value.trim();
  const maxResults = parseInt(document.getElementById('maxResults').value);
  const minRating = parseFloat(document.getElementById('minRating').value);

  if (!apiKey) { alert('Apify API key দাও!'); return; }
  if (!niche || !city) { alert('Niche আর City দাও!'); return; }

  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = 'RUNNING...';
  document.getElementById('logBox').innerHTML = '';
  document.getElementById('resultsCard').classList.remove('show');
  scrapedData = [];

  const query = `${niche} in ${city}`;
  log(`Search: "${query}"`, 'info');
  setStatus('Apify এ job submit হচ্ছে...', 'running');
  setProgress(10);

  try {
    // Start the actor run
    const runRes = await fetch('https://api.apify.com/v2/acts/compass~crawler-google-places/runs?token=' + apiKey, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        searchStringsArray: [query],
        maxCrawledPlacesPerSearch: maxResults,
        language: 'en',
        countryCode: 'us',
        includeWebResults: false,
      })
    });

    if (!runRes.ok) {
      const err = await runRes.json();
      throw new Error(err.error?.message || 'API error: ' + runRes.status);
    }

    const runData = await runRes.json();
    const runId = runData.data.id;
    log(`Job ID: ${runId}`, 'ok');
    setProgress(20);
    setStatus('Scraping চলছে... (১-৩ মিনিট লাগবে)', 'running');

    // Poll for completion
    let finished = false;
    let attempts = 0;
    while (!finished && attempts < 60) {
      await sleep(5000);
      attempts++;

      const statusRes = await fetch(`https://api.apify.com/v2/actor-runs/${runId}?token=${apiKey}`);
      const statusData = await statusRes.json();
      const status = statusData.data.status;

      const pct = Math.min(20 + attempts * 1.2, 85);
      setProgress(pct);
      log(`Status: ${status} (${attempts * 5}s)`, '');

      if (status === 'SUCCEEDED') {
        finished = true;
      } else if (['FAILED','ABORTED','TIMED-OUT'].includes(status)) {
        throw new Error('Job failed: ' + status);
      }
    }

    if (!finished) throw new Error('Timeout — অনেক বেশি সময় লাগছে');

    setStatus('Data download হচ্ছে...', 'running');
    setProgress(90);
    log('Results নামাচ্ছি...', 'info');

    // Get results
    const dataRes = await fetch(`https://api.apify.com/v2/actor-runs/${runId}/dataset/items?token=${apiKey}&format=json&limit=500`);
    const rawData = await dataRes.json();

    log(`মোট পাওয়া গেছে: ${rawData.length} টা business`, 'ok');

    // Process data
    scrapedData = rawData
      .filter(p => !minRating || (p.totalScore || 0) >= minRating)
      .map(p => ({
        'Business Name': p.title || '',
        'Phone':         p.phone || '',
        'Website':       p.website || '',
        'Email':         p.email || '',
        'Address':       p.address || '',
        'Rating':        p.totalScore || '',
        'Reviews':       p.reviewsCount || 0,
        'Category':      (p.categories || []).join(', '),
        'Google Maps':   p.url || '',
        'Status':        'Not Contacted',
        'Notes':         '',
      }));

    setProgress(100);
    setStatus(`সম্পন্ন! ${scrapedData.length} টা business পাওয়া গেছে`, 'done');
    log(`${scrapedData.length} টা result (rating filter পরে)`, 'ok');

    renderResults(scrapedData);

  } catch (err) {
    setStatus('Error: ' + err.message, 'error');
    log('ERROR: ' + err.message, 'err');
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'START SCRAPING';
  }
}

function renderResults(data) {
  const card = document.getElementById('resultsCard');
  card.classList.add('show');

  // Stats
  const withPhone = data.filter(d => d.Phone).length;
  const withWebsite = data.filter(d => d.Website).length;
  const noWebsite = data.filter(d => !d.Website).length;
  const avgRating = data.length ? (data.reduce((s,d) => s + (parseFloat(d.Rating)||0), 0) / data.length).toFixed(1) : 0;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-box"><div class="stat-num">${data.length}</div><div class="stat-label">মোট business</div></div>
    <div class="stat-box"><div class="stat-num">${withPhone}</div><div class="stat-label">Phone আছে</div></div>
    <div class="stat-box"><div class="stat-num">${withWebsite}</div><div class="stat-label">Website আছে</div></div>
    <div class="stat-box" style="border-color:rgba(0,255,136,0.3)"><div class="stat-num" style="color:#ffaa00">${noWebsite}</div><div class="stat-label">No Website ★</div></div>
  `;

  // Table
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = data.map((d, i) => `
    <tr>
      <td style="color:var(--muted)">${i+1}</td>
      <td style="font-weight:500;max-width:160px">${d['Business Name']}</td>
      <td>${d.Phone ? `<span class="tag tag-green">${d.Phone}</span>` : '<span class="tag tag-red">নেই</span>'}</td>
      <td>${d.Website ? `<span class="tag tag-green">আছে</span>` : '<span class="tag tag-yellow">নেই ★</span>'}</td>
      <td><span class="stars">★</span> ${d.Rating || '-'}</td>
      <td>${d.Reviews || 0}</td>
      <td style="color:var(--muted);font-size:12px">${(d.Address||'').substring(0,35)}...</td>
    </tr>
  `).join('');
}

function downloadExcel() {
  if (!scrapedData.length) { alert('আগে scraping করো!'); return; }

  const ws = XLSX.utils.json_to_sheet(scrapedData);
  const wb = XLSX.utils.book_new();

  // Column widths
  ws['!cols'] = [
    {wch:30},{wch:16},{wch:28},{wch:28},{wch:35},
    {wch:8},{wch:10},{wch:22},{wch:35},{wch:16},{wch:25}
  ];

  XLSX.utils.book_append_sheet(wb, ws, 'Leads');

  const niche = document.getElementById('niche').value.replace(/\s+/g,'_');
  const city = document.getElementById('city').value.replace(/\s+/g,'_');
  const fname = `${niche}_${city}_leads.xlsx`;

  XLSX.writeFile(wb, fname);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
